name: Build Menu Lengkap EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Compile C++ menjadi EXE
        run: g++ -static "tugas6.cpp" -o "tugas6.exe"

      - name: Upload file EXE
        uses: actions/upload-artifact@v4
        with:
          name: hasil-tugas6
          path: "tugas6.exe"
